name: Deploy to Development Server

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    environment: development

    steps:
      - name: "레포지토리에서 체크아웃한다."
        uses: actions/checkout@v4

      - name: "도커 허브에 로그인한다."
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: "도커 이미지를 빌드한다."
        run: |
          docker build -f ./docker/DockerfileDev -t ${{ secrets.DOCKER_USERNAME }}/tamago-server:latest .

      - name: "도커 허브에 빌드된 이미지를 푸시한다."
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/tamago-server:latest

  deploy:
    needs: build
    runs-on: ubuntu-22.04
    environment: development

    steps:
      - name: "애플리케이션 서버를 구동한다."
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            docker rm -f tamago-server || true

            docker pull ${{ secrets.DOCKER_USERNAME }}/tamago-server:latest

            docker run -d \
              --name tamago-server \
              --env-file .env \
              -e SPRING_PROFILES_ACTIVE=dev \
              -e JAVA_TOOL_OPTIONS="
              -Xms384m
              -Xmx512m
              -XX:MaxMetaspaceSize=96m
              -XX:MaxDirectMemorySize=32m
              -XX:ReservedCodeCacheSize=48m
              -XX:+UseSerialGC
              -Xss512k
              " \
              -p 8080:8080 \
              --network tamago \
              --cpus="0.5" \
              --memory="768m" \
              --memory-swap="768m" \
              ${{ secrets.DOCKER_USERNAME }}/tamago-server:latest

            docker image prune -f

      - name: "애플리케이션이 정상적으로 구동되었는지 확인한다."
        uses: jtalk/url-health-check-action@v4
        with:
          url: https://dev.runtamago.shop/actuator/health
          max-attempts: 10
          retry-delay: 10s
          retry-all: true

