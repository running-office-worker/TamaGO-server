name: Schema Validation

on:
  pull_request:

jobs:
  schema-validation:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        java-version: [ 21 ]
        kotlin-version: [ 1.9.25 ]
        distribution: [ temurin ]

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: tamago
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: "레포지토리 체크아웃"
        uses: actions/checkout@v4

      - name: "Gradle Wrapper 무결성 검증"
        uses: gradle/actions/wrapper-validation@v4

      - name: "JDK ${{ matrix.java-version }} 설정"
        uses: actions/setup-java@v4
        with:
          distribution: ${{ matrix.distribution }}
          java-version: ${{ matrix.java-version }}
          cache: gradle

      - name: "Gradle 실행 권한 부여"
        run: chmod +x ./gradlew

      - name: "Flyway 마이그레이션"
        run: |
          ./gradlew :tamago-core:flywayMigrate \
            -Dflyway.url=jdbc:mysql://127.0.0.1:3306/tamago \
            -Dflyway.user=root \
            -Dflyway.password=test \
            --no-daemon --stacktrace

      - name: "Flyway 마이그레이션 무결성 검증"
        run: |
          ./gradlew :tamago-core:flywayValidate \
            -Dflyway.url=jdbc:mysql://127.0.0.1:3306/tamago \
            -Dflyway.user=root \
            -Dflyway.password=test \
            --no-daemon --stacktrace

      - name: "Hibernate 스키마 검증 테스트"
        uses: gradle/gradle-build-action@v3
        with:
          arguments: :tamago-core:test --no-daemon --stacktrace
