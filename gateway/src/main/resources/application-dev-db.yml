spring:
  config:
    activate:
      on-profile: dev-db

  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_SCHEMA:tamago}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

logging:
  level:
    org.springframework.orm.jpa: INFO