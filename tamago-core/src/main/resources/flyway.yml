spring:
  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: false
    locations:
      - classpath:db/migration
      - classpath:db/seed

logging:
  level:
    org.flywaydb: DEBUG

---
spring:
  config:
    activate:
      on-profile: dev, prod

  flyway:
    clean-disabled: true
    validate-on-migrate: true
